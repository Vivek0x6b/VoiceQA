[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceqa"
dynamic = ["version"]
description = "Local-first QA lab for AI voice agents over real SIP phone calls."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "typer",
    "pydantic>=2",
    "pyyaml",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
stt = ["faster-whisper>=1.1"]

[project.scripts]
voiceqa = "voiceqa.cli.main:app"

[project.urls]
Repository = "https://github.com/Vivek0x6b/VoiceQA"

[tool.hatch.version]
path = "src/voiceqa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceqa"]

# The LibriVox test clip ships in the wheel too, so `voiceqa bench stt`
# works outside a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"tests/data/speech" = "voiceqa/data/speech"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: runs a real speech model (needs the [stt] extra and the model in the local cache)",
]
